<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/lamniscateLogo.jpg"/>
    <title>Arun Saru | Graphic Design Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1em 0;
            background-image: url(./assets/banner.gif);
        }
        .container {
            max-width: 1200px;
            margin: 2em auto;
            padding: 1em;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 1em;
            border-radius: 7px;
        }
        .portfolio-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-basis: calc(33.333% - 1em);
            box-sizing: border-box;
        }
        .portfolio-item img {
            width: 100%;
            height: 50vh;
            border: 2px solid #f0f0f0;
            border-radius: 5px;
            cursor: pointer;
        }
        .portfolio-item img:hover {
            transition: transform .5s;
            transform: scale(1.05);
        }
        .portfolio-item h2 {
            margin: 0.5em 0;
            color: #333;
        }
        footer {
            text-align: center;
            padding: 1em 0;
            background-color: #003821;
            color: #fff;
            background-image: url(./assets/banner.gif);
        }
        footer a {
            text-decoration: none;
            color: #f0f0f0;
        }
        footer a:hover {
            color: #ddd;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }
        .modal-content {
            margin: 5% auto;
            display: block;
            width: 80%;
            max-width: 700px;
        }
        .modal-content img {
            width: 100%;
        }
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
        @media (max-width: 1024px) {
            .portfolio-item {
                flex-basis: calc(50% - 1em);
            }
        }
        @media (max-width: 768px) {
            .portfolio-item {
                flex-basis: 100%;
            }
            .portfolio-item img {
                max-width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Graphic Design Portfolio</h1>
    </header>
    <div class="container" id="portfolio-container">
        <!-- Portfolio items will be injected here by JavaScript -->
    </div>
    <footer>
        &copy; 2024 <a href="https://www.arunsaru.com.np" target="_blank">Arun Saru</a>. All rights reserved.
    </footer>

    <!-- Modal for full image display -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
            <img id="modal-img" src="" alt="">
        </div>
    </div>

    <script>
        const portfolioItems = [
            { title: 'Security Application Banner', imageUrl: './assets/AppPoster.png' },
            { title: 'Artrick - Camping Nepal', imageUrl: './assets/campingNepal-Artrick.png' },
            { title: 'Consultancy Advertisement', imageUrl: './assets/CounsultancyAdvertise.png' },
            { title: 'For Her music cover art', imageUrl: './assets/ForHerAlbumArt.png' },
            { title: 'Informatics institute graphic(Ad)', imageUrl: './assets/Graphic Design Course infomatics.jpg' },
            { title: 'Informatics institute Web dev(Ad)', imageUrl: './assets/infomatics institute ad.png' },
            { title: 'Hope Store Banner', imageUrl: './assets/HopeBanner.png' },
            { title: 'Hope Store Gif', imageUrl: './assets/hopeStore.gif' },
            { title: 'Hope Store Logo', imageUrl: './assets/hopeLogo.png' },
            { title: 'Lamniscate Inc. Banner', imageUrl: './assets/LAMNISCATE INC..png' },
            { title: 'Lamniscate Inc. logo', imageUrl: './assets/lamniscateLogo.jpg' },
            { title: 'Lamniscate Inc. logo#2', imageUrl: './assets/LamniscateInc.png' },
            { title: 'NFT.ied_ Black', imageUrl: './assets/NFT.ied_.png' },
            { title: 'NFT.ied_ Logo', imageUrl: './assets/NftiedLogo.png' },
            { title: 'NFT.ied_ White', imageUrl: './assets/NftiedWhite.png' },
            { title: 'Malai music cover art', imageUrl: './assets/MALAI.png' },
            { title: 'Aja music cover art', imageUrl: './assets/nuran.png' },
            { title: 'Sambudetya music cover art', imageUrl: './assets/Sambudetya.png' },
            { title: 'Visiting card front', imageUrl: './assets/1.png' },
            { title: 'Visiting card back', imageUrl: './assets/2.png' }
        ];

        const container = document.getElementById('portfolio-container');

        portfolioItems.forEach(item => {
            const portfolioItem = document.createElement('div');
            portfolioItem.className = 'portfolio-item';
            
            const img = document.createElement('img');
            img.src = item.imageUrl;
            img.alt = item.title;
            img.addEventListener('click', () => openModal(item.imageUrl));
            
            const title = document.createElement('h2');
            title.textContent = item.title;
            
            portfolioItem.appendChild(img);
            portfolioItem.appendChild(title);
            container.appendChild(portfolioItem);
        });

        // Modal functionality
        const modal = document.getElementById('myModal');
        const modalImg = document.getElementById('modal-img');
        const closeModal = document.getElementsByClassName('close')[0];

        function openModal(imageUrl) {
            modal.style.display = 'block';
            modalImg.src = imageUrl;
        }

        closeModal.onclick = function() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
