<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        

        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            margin: 20px auto; 
            max-width: 1200px; 
        }

        .video-container iframe {
            width: 100%;
            height: 315px; 
            border: none; 
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); 
            border-radius: 4px;
            transition: transform 0.3s ease-in-out;
        }
        .video-container iframe:hover {
            transform: scale(1.05);
            
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/videoseries?si=-D3FCAUttBnj3Kma&amp;list=PLBjl16myMdb4dTVCf__cMSxJ1H8ShGQw2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/videoseries?si=HEwrodPUsY8vq0vd&amp;list=PLBjl16myMdb4FVCJnf5SIqH6PNKMEJmLc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/videoseries?si=plsgUODn3_yDqILw&amp;list=PLBjl16myMdb4LscT7GBKMYwUj3WgnjfBu" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/videoseries?si=PB_grdwbYOYSenmc&amp;list=PLBjl16myMdb4QAFF_2S1uDH6NHRtphhlc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
</body>
</html>
