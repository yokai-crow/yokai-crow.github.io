<html>
    <head>

        <style>
                .bakas {
                    background-color: transparent;
                    width: 300px;
                    height: 300px;
                    perspective: 1000px;
                    margin: auto;
                    
                    
                }
                
                .innerbakas {
                    position: relative;
                    width: 100%;
                    height: 100%;
                    text-align: center;
                    transition: transform 0.6s;
                    transform-style: preserve-3d;
                    border-radius: 50%;
                    margin: 10px;
                }
                
                .bakas:hover .innerbakas {
                    transform: rotateY(180deg);
                }
                
                .frontimage, .backdetail {
                    position: absolute;
                    width: 100%;
                    height: 100%;
                    -webkit-backface-visibility: hidden;
                    backface-visibility: hidden;
                }
                
                .frontimage {
                    margin: 10px;
                    background-color: transparent;
                    color: black;
                    
                    
                }
                
                .backdetail {
                    border-radius: 50%;
                    background-color: black;
                    color: white;
                    transform: rotateY(180deg);
                }
                .thulo-bakas{
                    
                    margin-left: 25%; margin-right: 25%;
                    border-radius: 7px;
                    background-color: transparent;
                    box-shadow: 0 .5rem 1rem rgba(0,0,0,.2);
                }
                .quote{
                    text-align: center;
                    padding: 0 0 30px 0;
                    font-family: cursive;
                    font-size: 30px;
                    color: #1B9C85;
                    margin: auto;

                }
                @media screen and (max-width: 600px) {
                .thulo-bakas {
                    width: 90%;
                    margin-right: 100%;
                    margin-left: 0;
                    background-color: transparent;
                    box-shadow: none;
                }
                .quote{
                    text-align: center;
                    padding: 0 0 30px 0;
                    font-family: cursive;
                    font-size: 30px;
                    color: #1B9C85;
                    margin-top: 10px;
                }
        }
            
        </style>
    </head>
    <body>
        <div id="About" class="About">
        
            <div class="thulo-bakas">
                <br>
                <div class="bakas">
                    <div class="innerbakas">
                        <div class="frontimage">
                            <img src="../img/a.jpeg" 
                            alt="arunsaru" 
                            style="height:300px; width: 300px; border-radius: 50%;">
                        </div>
                        <div class="backdetail" style="font-family: cursive;">
                            <br><br><br><br>
                            <h1>Arun Saru</h1>
                            <p>Developer | Rapper | Researcher</p>
                            
                        </div>
                    </div>
                </div>
                <br><br><br>
                <span class="quote" style="font-size: 16px; margin-left: 10%; text-align: center; font-family: cursive;">“Talk is cheap. Show me the code.” <br><span style=" margin-left:40%; ">-Linus Torvalds</span> </span>
    
                <br><br><br>
            
            </div>
        </div>
    </body>
    
</html>
